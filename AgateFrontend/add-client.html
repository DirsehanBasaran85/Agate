<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Client</title>
    <style>
        /* Add your previous CSS here */
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Add New Client</h1>
    </header>
    <nav>
        <!-- Add your navigation links here -->
    </nav>

    <div class="container form-container">
        <h2>Client Information</h2>
        <form id="addClientForm">
            <div class="form-group">
                <label for="clientName">Name</label>
                <input type="text" id="clientName" name="clientName" required>
            </div>
            <div class="form-group">
                <label for="clientAddress">Address</label>
                <input type="text" id="clientAddress" name="clientAddress" required>
            </div>
            <div class="form-group">
                <label for="clientPhone">Phone Number</label>
                <input type="text" id="clientPhone" name="clientPhone" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Add Client">
            </div>
        </form>
    </div>

    <footer>
        <p>Agate &copy; 2024</p>
    </footer>

    <script>
        document.getElementById("addClientForm").addEventListener("submit", async function(event) {
            event.preventDefault(); // Formun varsayılan gönderim işlemini engelle

            // Formdan alınan bilgileri bir JSON nesnesine dönüştür
            const clientData = {
                name: document.getElementById("clientName").value,
                address: document.getElementById("clientAddress").value,
                contactInformation: document.getElementById("clientPhone").value
            };

            try {
                // Fetch API ile backend'e POST isteği gönder
                const response = await fetch("http://localhost:8080/Client", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json" // JSON verisi gönderileceğini belirtir
						
                    },
                    body: JSON.stringify(clientData) // JSON formatına dönüştür ve gönder
                });

                if (response.ok) {
                    alert("Client added successfully!");
                    document.getElementById("addClientForm").reset(); // Formu temizle
                } else {
                    const errorText = await response.text(); // Hata mesajını al
                    alert(`Failed to add client. Server responded with: ${errorText}`);
                }
            } catch (error) {
                console.error("Error while adding client:", error);
                alert("An error occurred while adding the client. Please try again.");
            }
        });
    </script>
</body>
</html>
