<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Staff to Campaign</title>
    <style>
        /* CSS styling here */
        /* Add your previous CSS here */
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }

    </style>
</head>
<body>
    <header>
        <h1>Assign Staff to Campaign</h1>
    </header>
    <div class="container form-container">
        <form id="assignForm">
            <div class="form-group">
                <label for="campaignID">Campaign ID</label>
                <input type="text" id="campaignID" name="campaignID" required>
            </div>
            <div class="form-group">
                <label for="staffID">Staff ID</label>
                <input type="text" id="staffID" name="staffID" required>
            </div>
            <div class="form-group">
                <input type="submit" value="Assign Staff">
            </div>
        </form>
    </div>
    <script>
        document.getElementById("assignForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const campaignId = document.getElementById("campaignID").value;
            const staffId = document.getElementById("staffID").value;
			const apiUrl = `http://localhost:8080/Staff/${staffId}/campaign/${campaignId}`;
			
			try{
				console.log("Here");
				const response = await fetch(apiUrl, {
					method: 'PUT',
					headers: {
						'Content-Type': 'application/json'
					}
				})
				if (response.ok) {
                    alert("Staff successfully assigned to campaign!");;
                } else {
                    alert("Error: Could not assign staff to campaign.");
                }
			} catch(error) {
				console.error("Error:", error);
				alert("Error: Could not assign staff to campaign.");
			};
        });
    </script>
</body>
</html>
