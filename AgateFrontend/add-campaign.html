<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Campaign</title>
    <style>
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Add New Campaign</h1>
    </header>
    <div class="container form-container">
        <form id="addCampaignForm">
            <div class="form-group">
                <label for="campaignName">Campaign Name</label>
                <input type="text" id="campaignName" name="campaignName" required>
            </div>
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" name="startDate" required>
            </div>
            <div class="form-group">
                <label for="endDate">End Date</label>
                <input type="date" id="endDate" name="endDate" required>
            </div>
            <div class="form-group">
                <label for="estimatedPrice">Estimated Price</label>
                <input type="number" id="estimatedPrice" name="estimatedPrice" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="budget">Budget</label>
                <input type="number" id="budget" name="budget" required>
            <div class="form-group">
                <input type="submit" value="Add Campaign">
            </div>
            <br>
        </form>
    </div>
   
<script>
    document.getElementById("addCampaignForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const campaignData = {
            title: document.getElementById("campaignName").value,
            startDate: document.getElementById("startDate").value,
            endDate: document.getElementById("endDate").value,
            estimatedPrice: document.getElementById("estimatedPrice").value,
            budget: document.getElementById("budget").value,
        };

        try {
            const response = await fetch("http://localhost:8080/Campaign", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(campaignData),
            });
            if (response.ok) {
                alert("Campaign added successfully!");
                document.getElementById("addCampaignForm").reset();
            } else {
                alert("Failed to add campaign. Please try again.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred. Please try again.");
        }
    });
</script>

</body>
</html>
