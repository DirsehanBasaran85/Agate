<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Note</title>
    <style>
        /* CSS styling here */
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Create New Note</h1>
    </header>
    <div class="container form-container">
        <form id="noteForm">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" required>
            </div>
            <div class="form-group">
                <label for="staffID">Staff ID</label>
                <input type="text" id="staffID" name="staffID" required>
            </div>
            <div class="form-group">
                <label for="noteContent">Note</label>
                <textarea id="noteContent" name="noteContent" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <input type="submit" value="Save Note">
            </div>
        </form>
    </div>

<script>
    document.getElementById("noteForm").addEventListener("submit", async function(event) {
        event.preventDefault();
        const noteData = {
            name: document.getElementById("title").value,
            notes: document.getElementById("noteContent").value,
        };
		const staffid = document.getElementById("staffID").value;
		const apiUrl = `http://localhost:8080/ConceptNotes/${staffid}`;
		
        try {
            const response = await fetch(apiUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(noteData),
            });
            if (response.ok) {
                alert("Note saved successfully!");
                document.getElementById("noteForm").reset();
            } else {
                alert("Failed to save note. Please try again.");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("An error occurred. Please try again.");
        }
    });
</script>

</body>
</html>
