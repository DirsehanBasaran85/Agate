<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Advert</title>
    <style>
        /* CSS styling here */
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            resize: vertical;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Add New Advert</h1>
    </header>
    <div class="container form-container">
        <form id="advertForm">
            <div class="form-group">
                <label for="campaignid">Campaign ID</label>
                <input type="text" id="campaignid" name="campaignid" required>
            </div>
            <div class="form-group">
                <label for="advertName">Advert Name</label>
                <input type="text" id="advertName" name="advertName" required>
            </div>
            <div class="form-group">
                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" name="startDate" required>
            </div>
            <div class="form-group">
                <label for="recordCompletion">Record Completion</label>
                <input type="number" id="recordCompletion" name="recordCompletion" required>
            </div>
            
            <div class="form-group">
                <input type="submit" value="Add Advert">
            </div>
        </form>
    </div>
    <script>
        document.getElementById("advertForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const advertData = {
                name: document.getElementById("advertName").value,
                plannedStartDate: document.getElementById("startDate").value,
                recordCompletion: document.getElementById("recordCompletion").value,
            };
            const campaignid = document.getElementById("campaignid").value;
			const postApiUrl = `http://localhost:8080/Advert/${campaignid}`;
            try {
                const response = await fetch(postApiUrl , {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(advertData),
                });

				if (!campaignid) {
					alert("Please enter a valid Campaign ID.");
					return;
				} else if (response.ok) {
                    alert("Advert added successfully!");
                    document.getElementById("advertForm").reset();
                } else {
                    alert("Failed to add advert. Please try again.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            }
        });
    </script>
</body>
</html>
