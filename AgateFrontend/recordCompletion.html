<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Record Completion</title>
    <style>
        .form-container {
            width: 80%;
            margin: 20px auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }

        .form-group input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .form-group input[type="submit"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Update Record Completion</h1>
    </header>
    <div class="container form-container">
        <form id="completionForm">
            <div class="form-group">
                <label for="advertId">Advert ID</label>
                <input type="number" id="advertId" name="advertId" required>
            </div>
            <div class="form-group">
                <label for="stateOfCompletion">State of Completion</label>
                <input type="text" id="stateOfCompletion" name="stateOfCompletion" required>
            </div>
            
            <div class="form-group">
                <input type="submit" value="Update Completion">
            </div>
        </form>
    </div>
    <script>
        document.getElementById("completionForm").addEventListener("submit", async function(event) {
            event.preventDefault();
			
            const stateofcompletion = document.getElementById("stateOfCompletion").value;
            const advertId = document.getElementById("advertId").value; // Get the Advert ID
			const apiUrl = `http://localhost:8080/Advert/by/${advertId}/to/${stateofcompletion}`;

            try {
                const response = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" }
                });

                if (response.ok) {
                    alert("State of Completion updated successfully!");
                    document.getElementById("completionForm").reset();
                } else {
                    alert("Failed to update completion state. Please try again.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("An error occurred. Please try again.");
            }
        });
    </script>
</body>
</html>
