<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Notes</title>
    <style>
        /* Add your previous CSS here */
        .table-container {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        table {
            width: 100%;
            border: 1px solid #ccc;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid #ddd;
        }

        th {
            background-color: #f4f4f4;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <h1>Browse Notes</h1>
    </header>
    <nav>
        <!-- Add your navigation links here -->
    </nav>

    <div class="container table-container">
        <h2>Notes List</h2>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Staff Name</th>
					<th>Staff lastName</th>
                    <th>Content</th>
                </tr>
            </thead>
            <tbody id="notesTableBody">
                <!-- Dynamic notes data will go here -->
            </tbody>
        </table>
		<p class="error-message" id="conceptNotesErrorMessage" style="display: none;">Failed to load campaign data. Please try again later.</p>
    </div>
	
	
    <footer>
        <p>Agate &copy; 2024</p>
    </footer>

    <script>
		
        async function fetchNotes() {
            try {
                const response = await fetch("http://localhost:8080/ConceptNotes");
                if (!response.ok) {
                    throw new Error(`Server responded with status: ${response.status}`);
                }
                const conceptNotes = await response.json();
				console.log(conceptNotes);
                const tableBody = document.getElementById("notesTableBody");
                tableBody.innerHTML = "";
                conceptNotes.forEach(conceptNote => {
                    const row = document.createElement("tr");
                    row.innerHTML = `
                        <td>${conceptNote.name}</td>
                        <td>${conceptNote.staff.firstName}</td>
						<td>${conceptNote.staff.lastName}</td>
                        <td>${conceptNote.notes}</td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error("Error fetching conceptNotes:", error);
                document.getElementById("conceptNotesErrorMessage").style.display = "block";
            }
        }
		window.addEventListener("DOMContentLoaded", () => {
            fetchNotes();
        });
    </script>
</body>
</html>
