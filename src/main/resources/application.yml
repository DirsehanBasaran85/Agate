spring:
  application:
    name: Agate
  datasource:
    url: jdbc:postgresql://localhost:5432/agate
    username: youruser
    password: yourpassword
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
server:
    port: 8080
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html